// Direct, required @GameTest methods in the API65 namespaces. These expectations
// are independent of the number Forge actually reports from the launched JVM.
def api65Counts = [
    api65_admin_buildings: 4, api65_auth: 7, api65_auth_codec: 1, api65_auth_extended: 13,
    api65_auth_final: 4, api65_auth_lifecycle: 4, api65_auth_lobby: 1, api65_auth_modesettlement: 2,
    api65_auth_sync: 2, api65_death: 5, api65_economy: 10, api65_item_dimension: 1,
    api65_snapshot_request: 1, api65_survival: 3, api65_unit_dimensions: 3, api65_unit_utils: 5,
    api65_units: 24, api65_world: 16, api65_world_table: 2, api65_addon: 7, api65_addon_restart: 1,
    api65_editor_worlds: 2, api65_repair_play: 4, api65_repair2_cargo: 1, api65_repair2_survival: 1, api65_repair2_training: 3, api65_repair2_lobby: 2, api65_repair2_hero: 1, api65_repair2_beacon: 2, api65_repair3_survival_result: 1, api65_repair3_scenario: 3
]
api65Counts.api65_followup_hero_xp = 3
api65Counts.each { namespace, count ->
    def phased = [
        api65_addon_restart: 'api65.addon.restart.phase',
        api65_repair2_cargo: 'api65.repair2.cargo.phase',
        api65_repair2_survival: 'api65.repair2.survival.phase',
        api65_repair3_survival_result: 'api65.repair3.survival.result.phase'
    ][namespace]
    suites[namespace] = phased != null ? [namespace, !(namespace in ['api65_repair2_survival', 'api65_repair3_survival_result']), phased] : [namespace, namespace in ['api65_addon', 'api65_repair2_training', 'api65_repair2_beacon']]
}

def resolve = { Closure prop ->
    def addon = prop('dreamseekers') != null
    def module = addon ? 'addon' : 'core'
    // Preserve established paths for legacy prepare/verify baselines.
    def coreProbes = [
        resourceEconomyTest: ['reignofnether_resource_economy', "run-resource-economy-${module}-v2"],
        resourceEconomyRestartPhase: ['reignofnether_resource_economy_restart', "run-resource-economy-${module}-restart-v2", 'resource.economy.restart.phase'],
        killEconomyTest: ['reignofnether_kill_economy', "run-kill-economy-${module}-v8"],
        killValueRestartPhase: ['reignofnether_kill_restart', addon ? 'run-kill-economy-addon-restart-v8' : 'run-kill-economy-restart-v8', 'resource.kill.restart.phase'],
        oreRestartPhase: ['reignofnether', addon ? 'run-dreamseekers-gametest' : 'run-gametest', 'ore.mine.restart.phase']
    ]
    def retired = retiredAddonProbes.keySet().find { prop(it) != null }
    if (retired != null)
        throw new GradleException("${retired} was retired; use -Pdreamseekers -PresourceTechSuite=${retiredAddonProbes[retired]}")
    def selected = (['resourceTechSuite'] + coreProbes.keySet() + addonProbes).findAll { prop(it) != null }
    if (selected.size() > 1)
        throw new GradleException('Choose exactly one GameTest selector; conflicting properties: ' + selected.join(', '))
    def selector = selected ? selected[0] : null
    if (prop('dreamseekersTestCase') != null && selector != 'dreamseekersTestBatch')
        throw new GradleException('dreamseekersTestCase requires -PdreamseekersTestBatch=<batch>')
    def suite = prop('resourceTechSuite')
    def phase = prop('resourceTechPhase')
    def run = prop('resourceTechRun')
    if (suite == null && (phase != null || run != null))
        throw new GradleException('resourceTechPhase and resourceTechRun require -PresourceTechSuite=<suite>')
    if (selector == 'resourceTechSuite') {
        def spec = suites[suite]
        if (spec == null) throw new GradleException("Unknown resourceTechSuite: ${suite}")
        if (spec[1] && !addon) throw new GradleException("${suite} requires -Pdreamseekers")
        def suffix = run == null ? 'integrated-v1' : run
        if (!(suffix ==~ /[A-Za-z0-9_-]{1,96}/)) throw new GradleException('Invalid resourceTechRun suffix')
        if (spec.size() == 3) {
            def phases = ['prepare', 'verify']
            if (suite in ['research_restart', 'api65_repair2_cargo', 'api65_repair2_survival']) phases += 'verify_settled'
            if (suite == 'api65_repair2_survival') phases += 'verify_final'
            if (suite == 'api65_repair3_survival_result') phases += 'verify_terminal'
            if (!(phase in phases)) throw new GradleException("${suite} requires -PresourceTechPhase=" + phases.join('|'))
        } else if (phase != null) throw new GradleException("${suite} does not take resourceTechPhase")
        def expected = api65Counts[suite] ?: [api60_results_data: 4, api63_native_production: 8, elevation_routes: 9][suite]
        if (suite == 'api60_results_restart') expected = phase == 'prepare' ? 1 : 4
        return [suite: suite, module: module, namespace: spec[0], directory: "run-resource-tech-${suite}-${module}-${suffix}",
                phaseKey: spec.size() == 3 ? spec[2] : null, phase: phase, expected: expected]
    }
    if (selector in coreProbes.keySet()) {
        def spec = coreProbes[selector]
        def value = spec.size() == 3 ? prop(selector) : null
        if (spec.size() == 3 && !(value in ['prepare', 'verify'])) throw new GradleException("${selector} must be prepare or verify")
        return [suite: selector, module: module, namespace: spec[0], directory: spec[1],
                phaseKey: spec.size() == 3 ? spec[2] : null, phase: value]
    }
    if (!addon && selector != null) throw new GradleException("${selector} requires -Pdreamseekers")
    if (addon) return [module: module, legacyAddon: true, suite: selector ?: 'default']
    return [suite: 'default', module: module, namespace: 'reignofnether', directory: 'run-gametest']
}
gradle.ext.dreamseekersGameTestPlan = resolve { key -> providers.gradleProperty(key).orNull }
