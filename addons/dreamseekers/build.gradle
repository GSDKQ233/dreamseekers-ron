// Verify the effective ForgeGradle launch, not just the declarations above.
// Resolves the mapped runtime artifacts but never starts a server/world.
tasks.register('verifyDreamseekersDevServer') {
    group = 'verification'
    description = 'Check paired userdev server sources, mixins and locked dependency classpath.'
    doLast {
        def run = project.minecraft.runs.getByName('server')
        def launch = tasks.named('runServer', JavaExec).get()
        def mods = run.getMods().collectEntries { [(it.name): it.getSources()*.name.toSet()] }
        if (mods != [reignofnether: ['main'] as Set, dreamseekers: ['dreamseekers'] as Set] ||
                run.getAllSources()*.name.toSet() != (['main', 'dreamseekers'] as Set))
            throw new GradleException('Ordinary paired server must have exactly two production mod sources: ' + mods)
        if (launch.workingDir.canonicalFile != file('run-dreamseekers-server').canonicalFile ||
                !launch.args.containsAll(['-mixin.config=reignofnether.mixins.json', '-mixin.config=dreamseekers.mixins.json']) ||
                launch.args.any { it.toLowerCase(Locale.ROOT).contains('gametest') } ||
                launch.systemProperties['forge.gameTestServer']?.toString()?.toBoolean())
            throw new GradleException('Ordinary paired server has a wrong directory, launch target, or mixin')
        def lock = new groovy.json.JsonSlurper().parse(file('addons/dreamseekers/dependencies.lock.json'))
        def expected = lock.dependencies.collectEntries { [(it.mavenArtifact): it.mavenVersion] }
        def artifacts = configurations.dreamseekersRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll {
            it.moduleVersion.id.group == 'local.dreamseekers.dependencies'
        }
        def selected = artifacts.collectEntries { [(it.name): it.moduleVersion.id.version.replaceFirst(/_mapped_.+$/, '')] }
        def classpath = launch.classpath.files
        if (selected != expected || artifacts.size() != expected.size() || !artifacts.every { classpath.contains(it.file) })
            throw new GradleException('Paired server classpath differs from the locked addon dependency set: ' + selected)
        logger.lifecycle('DREAMSEEKERS_DEV_SERVER_PROFILE_PASS mods=' + mods + ' dependencies=' + selected + ' directory=' + launch.workingDir.name)
    }
}

tasks.register('runDreamseekersServer') {
    group = 'forgegradle runs'
    description = 'Start the paired ordinary development server (no GameTest fixtures).'
    dependsOn 'runServer'
}
tasks.register('runDreamseekersClient') {
    group = 'forgegradle runs'
    dependsOn 'runClient'
}

tasks.named('dreamseekersJar').configure {
    // MixinGradle otherwise injects every project refmap into every Jar task.
    exclude 'reignofnether.refmap.json'
}
// Conversely, the generic core must not contain the addon-only refmap either.
tasks.named('jar').configure { exclude 'dreamseekers.refmap.json' }

tasks.register('verifyDreamseekersCoreJar') {
    group = 'verification'
    description = 'Verify exact core/addon version compatibility and package separation.'
    dependsOn 'reobfJar', 'verifyDreamseekersJar'
    doLast {
        def coreFile = tasks.named('jar').get().archiveFile.get().asFile
        def core = new java.util.zip.ZipFile(coreFile)
        try {
            def entries = java.util.Collections.list(core.entries()).collect { it.name }
            def allTestLeaks = forbiddenTestContent(entries)
            if (!allTestLeaks.empty) throw new GradleException('Bundled test source-set content in core: ' + allTestLeaks)
            def leaked = entries.findAll { it.startsWith('com/dreamseekers/') ||
                    it.startsWith('assets/pasterdream/') || it.startsWith('data/pasterdream/') ||
                    it.endsWith('GameTests.class') || it == 'dreamseekers.refmap.json' }
            if (!leaked.empty) throw new GradleException('Addon/dependency/test content in core: ' + leaked)
            def addonFile = tasks.named('dreamseekersJar').get().archiveFile.get().asFile
            project.exec {
                commandLine([(project.findProperty('dreamseekersPython') ?: 'python3').toString(),
                        file('addons/dreamseekers/verify_paired_mods.py').absolutePath,
                        coreFile.absolutePath, addonFile.absolutePath, project.version.toString(), dreamseekersVersion])
            }
            def runtimeVersionSource = file('src/main/java/com/solegendary/reignofnether/ReignOfNether.java').getText('UTF-8')
            if (!runtimeVersionSource.contains('VERSION_STRING = "' + project.version.toString() + '"'))
                throw new GradleException('Core runtime/config version and artifact version disagree')
            ['com/solegendary/reignofnether/building/BuildingServerboundPacket.class',
             'com/solegendary/reignofnether/resources/ResourcesServerEvents.class',
             'reignofnether.refmap.json'].each { name ->
                if (!entries.contains(name)) throw new GradleException('Missing required core entry: ' + name)
            }
            logger.lifecycle('DREAMSEEKERS_CORE_JAR_CONTENT_PASS entries=' + entries.size() + ' version=' + project.version)
        } finally { core.close() }
    }
}

// Append to addons/dreamseekers/build.gradle. No production source set or release Jar changes.
