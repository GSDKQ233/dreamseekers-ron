// Source-derived audit guard also covers fixtures, controls and nested test classes.
def forbiddenTestContent = { List<String> entries ->
    def classNames = [] as Set
    def resourceNames = [] as Set
    ['src/gametest', 'addons/dreamseekers/src/gametest'].each { root ->
        fileTree(root + '/java').matching { include '**/*.java' }.files.each { source ->
            def packageMatch = source.getText('UTF-8') =~ /(?m)^package\s+([\w.]+)\s*;/
            if (packageMatch.find()) classNames.add(packageMatch.group(1).replace('.', '/') + '/' + source.name.replaceFirst(/\.java$/, ''))
        }
        def resourceRoot = file(root + '/resources').toPath()
        fileTree(root + '/resources').files.each { resource -> resourceNames.add(resourceRoot.relativize(resource.toPath()).toString().replace('\\', '/')) }
    }
    entries.findAll { entry -> resourceNames.contains(entry) || (entry.endsWith('.class') && classNames.any { name -> entry == name + '.class' || entry.startsWith(name + '$') }) }
}

// A cheap distribution guard: development dependencies must never leak into the
// release addon, and runtime-only GameTest code/resources must stay out too.
tasks.register('verifyDreamseekersJar') {
    group = 'verification'
    description = 'Check that the addon release contains only addon code/resources.'
    dependsOn 'reobfDreamseekersJar'
    doLast {
        def jarFile = tasks.named('dreamseekersJar').get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def entries = java.util.Collections.list(zip.entries()).collect { it.name }
            def unexpectedClasses = entries.findAll { it.endsWith('.class') && !it.startsWith('com/dreamseekers/') }
            if (!unexpectedClasses.empty) throw new GradleException('Bundled non-addon classes: ' + unexpectedClasses)
            def allTestLeaks = forbiddenTestContent(entries)
            if (!allTestLeaks.empty) throw new GradleException('Bundled test source-set content: ' + allTestLeaks)
            def unexpectedResources = entries.findAll { it.startsWith('assets/pasterdream/') || it.startsWith('data/pasterdream/') || it.contains('/gametest/') || it.endsWith('GameTests.class') || it.endsWith('.jar') }
            if (!unexpectedResources.empty) throw new GradleException('Bundled dependency or test content: ' + unexpectedResources)
            ['META-INF/mods.toml', 'LICENSE-DREAMSEEKERS.txt', 'CREDITS-DREAMSEEKERS.txt', 'dreamseekers.refmap.json'].each { path ->
                if (!entries.contains(path)) throw new GradleException('Missing required addon file: ' + path)
            }
            def refmapText = zip.getInputStream(zip.getEntry('dreamseekers.refmap.json')).getText('UTF-8')
            def refmap = new groovy.json.JsonSlurper().parseText(refmapText)
            if (!(refmap instanceof Map) || !(refmap.mappings instanceof Map)) {
                throw new GradleException('Addon refmap must be a nonempty JSON document with a mappings object')
            }
            def crownAtlas = zip.getEntry('assets/minecraft/atlases/blocks.json')
            if (crownAtlas == null) throw new GradleException('Missing crown entity-texture block atlas registration')
            def crownSources = new groovy.json.JsonSlurper().parseText(zip.getInputStream(crownAtlas).getText('UTF-8')).sources
            if (crownSources != [[type:'minecraft:single', resource:'pasterdream:entities/meltdream_crystal_entity', sprite:'pasterdream:entities/meltdream_crystal_entity']])
                throw new GradleException('Unexpected crown atlas registration; preserve narrow native texture reference')
            def cameraDistance = refmap.mappings['com/dreamseekers/unit/mixin/DreamUnitRenderDistanceMixin']
            if (!(cameraDistance instanceof Map) || cameraDistance['shouldRenderAtSqrDistance(D)Z'] != 'Lnet/minecraft/world/entity/Entity;m_6783_(D)Z')
                throw new GradleException('Missing production mapping for client-only Dream RTS camera distance')
            def flightGrip = refmap.mappings['com/dreamseekers/unit/mixin/ShadowGripFlyingImpulseMixin']
            if (!(flightGrip instanceof Map) || flightGrip.tick != 'Lcom/solegendary/reignofnether/unit/controls/FlyingUnitMoveControl;m_8126_()V')
                throw new GradleException('Missing production mapping for inherited FlyingUnitMoveControl.tick selector')
            def mixinConfig = new groovy.json.JsonSlurper().parseText(
                    zip.getInputStream(zip.getEntry('dreamseekers.mixins.json')).getText('UTF-8'))
            if (!mixinConfig.client.contains('DreamUnitRenderDistanceMixin') || mixinConfig.mixins.contains('DreamUnitRenderDistanceMixin'))
                throw new GradleException('Dream RTS camera distance mixin must remain client-list-only')
            if (mixinConfig.refmap != 'dreamseekers.refmap.json') {
                throw new GradleException('Addon mixin configuration does not reference its verified refmap')
            }
            def structureManifest = new groovy.json.JsonSlurper().parse(file('addons/dreamseekers/structure_manifest.json'))
            def structures = structureManifest.structures + structureManifest.runtime_template_assets
            structures.each { shape ->
                def name = shape.id
                def client = zip.getEntry('assets/dreamseekers/structures/' + name + '.nbt')
                def server = zip.getEntry('data/dreamseekers/structures/' + name + '.nbt')
                if (client == null || server == null)
                    throw new GradleException('Missing client/server structure: ' + name)
                byte[] shipped = zip.getInputStream(server).bytes
                if (!java.util.Arrays.equals(zip.getInputStream(client).bytes, shipped)
                        || java.security.MessageDigest.getInstance('SHA-256').digest(shipped).encodeHex().toString() != shape.sha256) {
                    throw new GradleException('Divergent or unexpected client/server structure: ' + name)
                }
            }
            if (!entries.contains('com/dreamseekers/function/DreamFunctionalPlacement.class'))
                throw new GradleException('Missing scaffold lifecycle implementation')
            logger.lifecycle('DREAMSEEKERS_JAR_CONTENT_PASS entries=' + entries.size() + ' refmapBytes=' + refmapText.getBytes('UTF-8').length + ' file=' + jarFile.name)
        } finally { zip.close() }
    }
}

