minecraft.runs {
    gameTestServer {
        // Reused aggregate worlds retain many fixture chunks; give this headless test JVM
        // an explicit ceiling and fail promptly on OOM instead of hanging its test runner.
        // This is not a client/server release memory setting or a gameplay workaround.
        jvmArgs '-Xms256m', '-Xmx4g', '-XX:+ExitOnOutOfMemoryError'
        arg '-mixin.config=dreamseekers.mixins.json'
        arg '-mixin.config=dreamseekers_spore_gametest.mixins.json'
        setForceExit false
        source sourceSets.dreamseekers
        source sourceSets.dreamseekersGametest
        mods {
            dreamseekers {
                source sourceSets.dreamseekers
                source sourceSets.dreamseekersGametest
            }
        }
    }
    // Use the canonical FG5 server template. The root already registers the
    // reignofnether mod from main; only production sources belong on this run.
    server {
        workingDirectory project.file('run-dreamseekers-server')
        args '--nogui'
        arg '-mixin.config=reignofnether.mixins.json'
        arg '-mixin.config=dreamseekers.mixins.json'
        source sourceSets.main
        source sourceSets.dreamseekers
        mods {
            dreamseekers { source sourceSets.dreamseekers }
        }
    }
    client {
        workingDirectory project.file('run-dreamseekers-client')
        arg '-mixin.config=dreamseekers.mixins.json'
        source sourceSets.dreamseekers
        mods {
            dreamseekers { source sourceSets.dreamseekers }
        }
    }
}

