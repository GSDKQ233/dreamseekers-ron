// Applied from the RoN checkout only with -Pdreamseekers.
// All third-party content stays in user-provided, locally cached dependencies.
// Nothing from those dependencies is copied or shaded into the addon JAR.
ext.dreamseekersVersion = '0.65.0-repair3.1-pathfinding.1-alpha'

def dependencyRepository = file(project.findProperty('dreamseekersDependencyRepo') ?: '.dreamseekers-deps/maven')
def dependencyGroup = 'local.dreamseekers.dependencies'
def dependencyLock = new groovy.json.JsonSlurper().parse(file('addons/dreamseekers/dependencies.lock.json'))
// ForgeGradle maps the original local artifacts. Re-attest those originals
// before registering mapped dependencies, rather than trusting Maven coordinates.
dependencyLock.dependencies.each { dep ->
    def rawJar = new File(dependencyRepository,
        "local/dreamseekers/dependencies/${dep.mavenArtifact}/${dep.mavenVersion}/${dep.mavenArtifact}-${dep.mavenVersion}.jar")
    if (!rawJar.isFile())
        throw new GradleException("Missing locked Dreamseekers dependency: ${rawJar.name}; run prepare_local_dependencies.py")
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    rawJar.withInputStream { stream ->
        byte[] buffer = new byte[65536]
        for (int count = stream.read(buffer); count != -1; count = stream.read(buffer))
            digest.update(buffer, 0, count)
    }
    def actual = digest.digest().encodeHex().toString()
    if (actual != dep.sha256)
        throw new GradleException("SHA256 mismatch for locked Dreamseekers dependency: ${rawJar.name}; re-import the official JAR")
}
// Keep the raw local repository ahead of remote repositories. Do not use
// exclusiveContent: ForgeGradle's generated remapping repository must also be
// allowed to serve the same group with its mapped-version suffix.
def localDependencyRepository = repositories.maven {
    name = 'dreamseekersVerifiedLocalDependencies'
    url = uri(dependencyRepository)
    content { includeGroup dependencyGroup }
}
repositories.remove(localDependencyRepository)
repositories.addFirst(localDependencyRepository)

sourceSets {
    dreamseekers {
        java.srcDir 'addons/dreamseekers/src/main/java'
        resources.srcDir 'addons/dreamseekers/src/main/resources'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    dreamseekersGametest {
        java.srcDir 'addons/dreamseekers/src/gametest/java'
        resources.srcDir 'addons/dreamseekers/src/gametest/resources'
        // Test helper stays in the core module; never split a core package into the addon.
        compileClasspath += sourceSets.gametest.output
        compileClasspath += sourceSets.main.output + sourceSets.dreamseekers.output + sourceSets.dreamseekers.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.dreamseekers.output + sourceSets.dreamseekers.runtimeClasspath
    }
    test {
        java.srcDir 'addons/dreamseekers/src/test/java'
        compileClasspath += sourceSets.dreamseekers.output
        runtimeClasspath += sourceSets.dreamseekers.runtimeClasspath
    }
}

configurations {
    dreamseekersImplementation.extendsFrom implementation
    dreamseekersAnnotationProcessor.extendsFrom annotationProcessor
    dreamseekersGametestImplementation.extendsFrom dreamseekersImplementation
}

// Mixin's generated refmap is a release input. A classpath-only incremental
// recompile can discard it without rerunning the addon annotation processor.
// Keep this local to the addon; do not change core compilation or dependencies.
tasks.named('compileDreamseekersJava', JavaCompile).configure {
    options.incremental = false
}

dependencies {
    dependencyLock.dependencies.each { dep ->
        dreamseekersImplementation fg.deobf("${dependencyGroup}:${dep.mavenArtifact}:${dep.mavenVersion}".toString())
    }
}

mixin {
    add sourceSets.dreamseekers, 'dreamseekers.refmap.json'
}

