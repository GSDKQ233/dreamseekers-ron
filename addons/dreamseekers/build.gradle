        property 'dreamseekers.visualFixture', 'true'
        property 'dreamseekers.visualFixtureWorld', project.file('run-dreamseekers-visual-fixture/saves/DREAMSEEKERS_VISUAL_FIXTURE').absolutePath
        source sourceSets.dreamseekersVisualFixture
        mods {
            dreamseekers { source sourceSets.dreamseekersVisualFixture }
        }
    }
