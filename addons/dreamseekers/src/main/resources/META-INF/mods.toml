modId="dreamseekers"
version="0.65.0-repair3.1-buildings.1"
displayName="Dreamseekers — PasterDream × Reign of Nether"
authors="Local compatibility project"
description='''
An independent RTS compatibility addon connecting the original PasterDream with Reign of Nether.
Build World Tree settlements, command the Dreamseekers faction, and develop branch upgrades,
Shadow Energy production, and resonance technologies.
Requires separately installed original dependencies.
No PasterDream code, models, textures, sounds or dependency JARs are included.
'''

